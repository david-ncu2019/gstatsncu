domain:
  nx: 20
  ny: 20
  nz: 10
  cell_size: 1.0

sgs_variogram:
  model: "Sph"
  range: 12.0
  sill: 1.0
  nugget: 0.1
  angle: 0.0
  anisotropy_ratio: 1.0

trend:
  type: "linear"
  coefficients:
    x: 0.05
    y: 0.05
    z: -0.1

noise:
  std_dev: 0.1

sampling:
  strategy: "random_uniform"
  fraction: 0.05

time_slice:
  enabled: false
  column: "time"

kriging:
  formula: "value ~ x + y + z"
  cv_nfold: 5

random_seed: 42